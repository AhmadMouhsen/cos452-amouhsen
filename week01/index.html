<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Week 1 Starter — Canvas &amp; Clear Color</title>
  <style>
    html, body { height: 100%; margin: 0; }
    canvas { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <canvas id="gl-canvas"></canvas>
  <script>
    const canvas = document.getElementById("gl-canvas");
    const gl = canvas.getContext("webgl2");

    if (!gl) {
      throw new Error("WebGL2 is not available on this device/browser.");
    }

    function resizeCanvasToDisplaySize() {
      const dpr = window.devicePixelRatio || 1;
      const width = Math.round(canvas.clientWidth * dpr);
      const height = Math.round(canvas.clientHeight * dpr);
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
      }
    }

    function render() {
      resizeCanvasToDisplaySize();
      gl.viewport(0, 0, canvas.width, canvas.height);

      // TODO(student): try changing these values
      //gl.clearColor(0.1, 0.15, 0.35, 1.0);
      //gl.clear(gl.COLOR_BUFFER_BIT);


      let colorIndex = 0;

      const colors = [
        [0.580, 0.149, 0.3490],
        [0.263, 0.541, 0.349],
        [0.439, 0.325, 0.808],
      ];

      

      function renderColor() {
        const [r, g, b] = colors[colorIndex];
        gl.clearColor(r, g, b, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);

      }

      setInterval(() => {
        colorIndex = (colorIndex + 1) % colors.length; 
        //Increments colorIndex by 1 and wraps it back to 0 when it reaches the end of the array.
        renderColor();
        // Line for debugging
        //console.log("Changing color to index:", colorIndex);
        console.log("RGB of Current Color:", colors[colorIndex]);
      }, 1000);

      
    }

    window.addEventListener("resize", render);
    render();
  </script>
</body>
</html>
